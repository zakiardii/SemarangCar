<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Mobil - Rental Mobil Semarang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <i class="bi bi-car-front-fill me-2"></i>SemarangCar
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="mobil.html">Mobil</a></li>
                    <li class="nav-item"><a class="nav-link" href="riwayat.html">Riwayat</a></li>
                </ul>
                <div class="d-flex align-items-center" id="authNavLinks"></div>
            </div>
        </div>
    </nav>

    <main class="py-5">
        <div class="container">
            <h2 class="fw-bold mb-4">Daftar Armada Mobil</h2>
            
            <div class="card card-modern p-4 mb-4">
                <form id="filterForm" class="row g-3">
                    <div class="col-md-3">
                        <input type="text" id="searchInput" class="form-control" placeholder="Cari nama mobil...">
                    </div>
                    <div class="col-md-3">
                        <select id="transmisiSelect" class="form-select">
                            <option value="">Semua Transmisi</option>
                            <option value="Otomatis">Otomatis</option>
                            <option value="Manual">Manual</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select id="kapasitasSelect" class="form-select">
                            <option value="">Semua Kapasitas</option>
                            <option value="4">>= 4 Kursi</option>
                            <option value="6">>= 6 Kursi</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary-custom w-100"><i class="bi bi-funnel me-1"></i> Filter</button>
                    </div>
                </form>
            </div>

            <div class="row g-4" id="carGrid"></div>
        </div>
    </main>

    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchCars();
            document.getElementById('filterForm').addEventListener('submit', (e) => {
                e.preventDefault();
                fetchCars();
            });
        });

        async function fetchCars() {
            const grid = document.getElementById('carGrid');
            grid.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

            const search = document.getElementById('searchInput').value;
            const transmisi = document.getElementById('transmisiSelect').value;
            const kapasitas = document.getElementById('kapasitasSelect').value;

            const url = new URL(`${API_BASE_URL}/mobil`);
            if (search) url.searchParams.append('search', search);
            if (transmisi) url.searchParams.append('transmisi', transmisi);
            if (kapasitas) url.searchParams.append('kapasitas', kapasitas);

            try {
                const res = await fetch(url);
                const cars = await res.json();

                if (cars.length === 0) {
                    grid.innerHTML = '<div class="col-12 text-center py-5"><p class="text-secondary">Mobil tidak ditemukan.</p></div>';
                    return;
                }

                grid.innerHTML = cars.map(car => `
                    <div class="col-md-4 fade-in">
                        <div class="card card-modern h-100 p-3">
                            <img src="${car.gambarUrl || 'https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&q=80&w=400'}" class="card-img-top rounded-3 mb-3" style="height:200px; object-fit:cover;">
                            <div class="card-body p-0">
                                <h5 class="card-title fw-bold mb-2">${car.nama}</h5>
                                <p class="text-primary fw-bold mb-3">${formatRupiah(car.harga)} <span class="text-secondary fw-normal fs-6">/ hari</span></p>
                                <div class="d-flex justify-content-between text-secondary small mb-3 border-top border-bottom py-2">
                                    <span><i class="bi bi-gear me-1"></i>${car.transmisi}</span>
                                    <span><i class="bi bi-people me-1"></i>${car.kapasitas} Kursi</span>
                                </div>
                                <a href="detail.html?id=${car.id}" class="btn btn-outline-primary w-100">Detail Mobil</a>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                grid.innerHTML = '<div class="col-12 text-center text-danger">Gagal mengambil data mobil.</div>';
            }
        }
    </script>
</body>
</html>

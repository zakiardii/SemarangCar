<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pemesanan - Rental Mobil Semarang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <i class="bi bi-car-front-fill me-2"></i>SemarangCar
            </a>
            <div class="d-flex align-items-center" id="authNavLinks"></div>
        </div>
    </nav>

    <main class="py-5">
        <div class="container">
            <h3 class="fw-bold mb-4">Riwayat Pemesanan Anda</h3>
            <div id="bookingList">
                <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', fetchHistory);

        async function fetchHistory() {
            const user = JSON.parse(localStorage.getItem('user'));
            const container = document.getElementById('bookingList');

            if (!user) {
                container.innerHTML = '<div class="alert alert-warning">Silakan login untuk melihat riwayat pemesanan.</div>';
                return;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/booking/user/${user.id}`);
                const history = await res.json();

                if (history.length === 0) {
                    container.innerHTML = '<p class="text-secondary">Belum ada riwayat booking.</p>';
                    return;
                }

                container.innerHTML = history.map(item => `
                    <div class="card card-modern p-4 mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold mb-0">${item.mobil.nama}</h5>
                            <span class="badge bg-warning-subtle text-warning border border-warning px-3 py-2 rounded-pill">${item.status}</span>
                        </div>
                        <div class="row g-2 text-secondary small">
                            <div class="col-md-3">Tanggal Mulai: <strong>${item.tanggalMulai}</strong></div>
                            <div class="col-md-3">Durasi: <strong>${item.durasiHari} Hari</strong></div>
                            <div class="col-md-3">Driver: <strong>${item.denganSopir ? 'Ya' : 'Tidak'}</strong></div>
                            <div class="col-md-3 text-md-end text-primary fw-bold fs-6">${formatRupiah(item.totalHarga)}</div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = '<div class="alert alert-danger">Gagal memuat riwayat.</div>';
            }
        }
    </script>
</body>
</html>

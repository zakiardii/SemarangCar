<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - SemarangCar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5" style="background: var(--gradient-hero);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card card-modern p-4 p-md-5 border-0 shadow-lg fade-in-up">
                    <div class="text-center mb-4">
                        <a class="navbar-brand d-inline-flex align-items-center gap-2 mb-2" href="index.html">
                            <i class="bi bi-car-front-fill fs-2 text-primary"></i>
                            <span class="fs-3">Semarang<span class="text-gradient">Car</span></span>
                        </a>
                        <h4 class="fw-bold mb-1">Buat Akun Baru</h4>
                        <p class="text-secondary small">Nikmati kemudahan reservasi sewa mobil dalam hitungan menit</p>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label" for="nama">Nama Lengkap</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 border-slate-300 rounded-start-3"><i class="bi bi-person text-secondary"></i></span>
                                <input type="text" id="nama" class="form-control border-start-0 ps-0" placeholder="Masukkan nama lengkap Anda" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label" for="email">Alamat Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 border-slate-300 rounded-start-3"><i class="bi bi-envelope text-secondary"></i></span>
                                    <input type="email" id="email" class="form-control border-start-0 ps-0" placeholder="nama@email.com" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="noHp">Nomor Handphone / WA</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 border-slate-300 rounded-start-3"><i class="bi bi-telephone text-secondary"></i></span>
                                    <input type="tel" id="noHp" class="form-control border-start-0 ps-0" placeholder="08123456789" required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="password">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 border-slate-300 rounded-start-3"><i class="bi bi-lock text-secondary"></i></span>
                                <input type="password" id="password" class="form-control border-start-0 ps-0" placeholder="Minimal 6 karakter" minlength="6" required>
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-primary-custom w-100 mb-3 py-2.5">
                            <span>Daftar Akun Sekarang</span> <i class="bi bi-check-circle me-1"></i>
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="small text-secondary mb-0">Sudah memiliki akun? <a href="login.html" class="text-primary fw-semibold text-decoration-none">Masuk di Sini</a></p>
                        <div class="mt-3">
                            <a href="index.html" class="text-secondary small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Kembali ke Beranda</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
        document.getElementById("registerForm").addEventListener("submit", async function(e){
            e.preventDefault();

            const nama = document.getElementById("nama").value.trim();
            const email = document.getElementById("email").value.trim();
            const noHp = document.getElementById("noHp").value.trim();
            const password = document.getElementById("password").value;
            const submitBtn = document.getElementById("submitBtn");

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> mendaftarkan...';

            try {
                const response = await fetch(`${API_BASE_URL}/user/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nama, email, noHp, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showToast(data.message || "Pendaftaran gagal, periksa kelengkapan data", "danger");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Daftar Akun Sekarang</span> <i class="bi bi-check-circle me-1"></i>';
                    return;
                }

                showToast("Pendaftaran berhasil! Mengalihkan ke halaman masuk...", "success");

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1200);

            } catch (err) {
                showToast("Server tidak dapat dihubungi. Pastikan backend Spring Boot telah berjalan.", "danger");
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Daftar Akun Sekarang</span> <i class="bi bi-check-circle me-1"></i>';
            }
        });
    </script>
</body>
</html>

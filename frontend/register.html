<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Rental Mobil Semarang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-modern p-4">
                    <h3 class="fw-bold text-center text-primary mb-4">Daftar Akun Baru</h3>
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">Nama Lengkap</label>
                            <input type="text" id="nama" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nomor Handphone</label>
                            <input type="tel" id="noHp" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 mb-3">Daftar Akun</button>
                    </form>
                    <p class="text-center small text-secondary mb-0">Sudah punya akun? <a href="login.html" class="text-primary text-decoration-none">Masuk</a></p>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
document.getElementById("registerForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const nama = document.getElementById("nama").value;
    const email = document.getElementById("email").value;
    const noHp = document.getElementById("noHp").value;
    const password = document.getElementById("password").value;


    try {

        const response = await fetch(`${API_BASE_URL}/user/register`, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                nama: nama,
                email: email,
                noHp: noHp,
                password: password

            })

        });


        if(!response.ok){

            const msg = await response.text();

            showToast(msg, "danger");

            return;

        }


        showToast("Pendaftaran berhasil, silakan masuk!", "success");


        setTimeout(() => {

            window.location.href = "login.html";

        }, 1500);


    } catch(err){

        console.log(err);

        showToast("Server tidak dapat dihubungi", "danger");

    }

});
</script>
</body>
</html>

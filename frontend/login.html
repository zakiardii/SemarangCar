<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Rental Mobil Semarang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-modern p-4">
                    <h3 class="fw-bold text-center text-primary mb-4">Masuk SemarangCar</h3>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" placeholder="Contoh: admin@semarangcar.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="******" required>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 mb-3">Masuk</button>
                    </form>
                    <p class="text-center small text-secondary mb-0">Belum punya akun? <a href="register.html" class="text-primary text-decoration-none">Daftar</a></p>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
document.getElementById("loginForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {

        const response = await fetch(`${API_BASE_URL}/user/login`, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })

        });


        if (!response.ok) {

            const msg = await response.text();

            showToast(msg, "danger");

            return;

        }


        const user = await response.json();


        localStorage.setItem("user", JSON.stringify(user));


        showToast("Login berhasil", "success");


        setTimeout(() => {

            if (user.role === "ADMIN") {

                window.location.href = "admin.html";

            } else {

                window.location.href = "index.html";

            }

        }, 1000);


    } catch (err) {

        console.log(err);

        showToast("Server tidak dapat dihubungi", "danger");

    }

});
</script>
</body>
</html>

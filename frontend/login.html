<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Akun - SemarangCar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5" style="background: var(--gradient-hero);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card card-modern p-4 p-md-5 border-0 shadow-lg fade-in-up">
                    <div class="text-center mb-4">
                        <a class="navbar-brand d-inline-flex align-items-center gap-2 mb-2" href="index.html">
                            <i class="bi bi-car-front-fill fs-2 text-primary"></i>
                            <span class="fs-3">Semarang<span class="text-gradient">Car</span></span>
                        </a>
                        <h4 class="fw-bold mb-1">Selamat Datang Kembali</h4>
                        <p class="text-secondary small">Masuk untuk mengelola reservasi sewa mobil Anda</p>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label" for="email">Alamat Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 border-slate-300 rounded-start-3"><i class="bi bi-envelope text-secondary"></i></span>
                                <input type="email" id="email" class="form-control border-start-0 ps-0" placeholder="nama@email.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label mb-0" for="password">Password</label>
                                <a href="#" data-bs-toggle="modal" data-bs-target="#resetPasswordModal" class="small text-primary text-decoration-none fw-semibold">Lupa Password?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 border-slate-300 rounded-start-3"><i class="bi bi-lock text-secondary"></i></span>
                                <input type="password" id="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-primary-custom w-100 mb-3 py-2.5">
                            <span>Masuk Sekarang</span> <i class="bi bi-arrow-right-short fs-4"></i>
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="small text-secondary mb-0">Belum memiliki akun? <a href="register.html" class="text-primary fw-semibold text-decoration-none">Daftar Akun Baru</a></p>
                        <div class="mt-3">
                            <a href="index.html" class="text-secondary small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Kembali ke Beranda</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Lupa Password / Reset Password -->
    <div class="modal fade" id="resetPasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow-lg p-3">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-key me-2 text-primary"></i> Reset Password Akun</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <p class="text-secondary small mb-3">Masukkan email terdaftar dan nomor HP Anda untuk verifikasi pembaruan password baru.</p>
                    <form id="resetPasswordForm">
                        <div class="mb-3">
                            <label class="form-label" for="resetEmail">Email Terdaftar</label>
                            <input type="email" id="resetEmail" class="form-control" placeholder="nama@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="resetNoHp">Nomor HP Terdaftar</label>
                            <input type="text" id="resetNoHp" class="form-control" placeholder="08123456789" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="resetNewPassword">Password Baru</label>
                            <input type="password" id="resetNewPassword" class="form-control" placeholder="Minimal 4 karakter" minlength="4" required>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Batal</button>
                            <button type="submit" id="resetSubmitBtn" class="btn btn-primary-custom">Perbarui Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(e){
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const submitBtn = document.getElementById("submitBtn");

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Memproses...';

            try {
                const response = await fetch(`${API_BASE_URL}/user/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showToast(data.message || "Login gagal, silakan periksa email & password", "danger");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Masuk Sekarang</span> <i class="bi bi-arrow-right-short fs-4"></i>';
                    return;
                }

                localStorage.setItem("user", JSON.stringify(data.user));
                if (data.token) {
                    localStorage.setItem("token", data.token);
                }

                showToast(`Selamat datang kembali, ${data.user.nama}!`, "success");

                setTimeout(() => {
                    if (data.user.role === "ADMIN") {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "index.html";
                    }
                }, 800);

            } catch (err) {
                showToast("Server tidak dapat dihubungi. Pastikan backend Spring Boot telah berjalan.", "danger");
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Masuk Sekarang</span> <i class="bi bi-arrow-right-short fs-4"></i>';
            }
        });

        document.getElementById("resetPasswordForm").addEventListener("submit", async function(e){
            e.preventDefault();
            const email = document.getElementById("resetEmail").value.trim();
            const noHp = document.getElementById("resetNoHp").value.trim();
            const newPassword = document.getElementById("resetNewPassword").value;
            const btn = document.getElementById("resetSubmitBtn");

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Memperbarui...';

            try {
                const res = await fetch(`${API_BASE_URL}/user/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, noHp, newPassword })
                });

                const data = await res.json();

                if (res.ok) {
                    showToast("Password berhasil diperbarui! Silakan login dengan password baru Anda.", "success");
                    const modalEl = document.getElementById("resetPasswordModal");
                    const bsModal = bootstrap.Modal.getInstance(modalEl);
                    if (bsModal) bsModal.hide();
                    document.getElementById("email").value = email;
                    document.getElementById("password").value = "";
                } else {
                    showToast(data.message || "Gagal memperbarui password", "danger");
                }
            } catch (err) {
                showToast("Terjadi kesalahan koneksi server", "danger");
            } finally {
                btn.disabled = false;
                btn.innerText = "Perbarui Password";
            }
        });
    </script>
</body>
</html>

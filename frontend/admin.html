<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Rental Mobil Semarang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="admin.html">
                <i class="bi bi-shield-lock-fill me-2"></i>Admin Dashboard
            </a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3"><i class="bi bi-person-circle me-1"></i> Administrator</span>
                <button onclick="logout()" class="btn btn-outline-light btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <main class="py-5">
        <div class="container">
            <h3 class="fw-bold mb-4">Kelola Pemesanan Pelanggan</h3>
            <div class="card card-modern p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Pelanggan</th>
                                <th>Mobil</th>
                                <th>Tanggal</th>
                                <th>Durasi</th>
                                <th>Total Biaya</th>
                                <th>Status Saat Ini</th>
                                <th>Aksi Ubah Status</th>
                            </tr>
                        </thead>
                        <tbody id="adminBookingTable">
                            <tr><td colspan="8" class="text-center py-4">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || user.role !== 'ADMIN') {
                alert('Akses ditolak! Halaman ini khusus Admin.');
                window.location.href = 'login.html';
                return;
            }
            loadAllBookings();
        });

        async function loadAllBookings() {
            const tbody = document.getElementById('adminBookingTable');
            try {
                const res = await fetch(`${API_BASE_URL}/booking`);
                const bookings = await res.json();

                if (bookings.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-secondary">Belum ada pesanan masuk.</td></tr>';
                    return;
                }

                tbody.innerHTML = bookings.map(b => {
                    let badgeClass = 'bg-warning text-dark';
                    if (b.status === 'APPROVED') badgeClass = 'bg-success text-white';
                    if (b.status === 'REJECTED') badgeClass = 'bg-danger text-white';

                    return `
                    <tr>
                        <td><strong>#${b.id}</strong></td>
                        <td>${b.user ? b.user.nama : 'Pelanggan'}</td>
                        <td>${b.mobil ? b.mobil.nama : '-'}</td>
                        <td>${b.tanggalMulai}</td>
                        <td>${b.durasiHari} Hari</td>
                        <td class="fw-bold text-primary">${formatRupiah(b.totalHarga)}</td>
                        <td><span class="badge ${badgeClass} px-3 py-2 rounded-pill">${b.status}</span></td>
                        <td>
                            <button onclick="changeStatus(${b.id}, 'APPROVED')" class="btn btn-sm btn-success me-1" title="Setujui">
                                <i class="bi bi-check-lg"></i>
                            </button>
                            <button onclick="changeStatus(${b.id}, 'REJECTED')" class="btn btn-sm btn-danger" title="Tolak">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </td>
                    </tr>
                    `;
                }).join('');
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">Gagal memuat pesanan.</td></tr>';
            }
        }

        async function changeStatus(bookingId, statusBaru) {
            try {
                const res = await fetch(`${API_BASE_URL}/booking/${bookingId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: statusBaru })
                });

                if (res.ok) {
                    showToast(`Status berhasil diubah menjadi ${statusBaru}`, 'success');
                    loadAllBookings();
                } else {
                    showToast('Gagal mengubah status', 'danger');
                }
            } catch (e) {
                showToast('Terjadi kesalahan koneksi', 'danger');
            }
        }
    </script>
</body>
</html>

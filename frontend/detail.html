<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Mobil - Rental Mobil Semarang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <i class="bi bi-car-front-fill me-2"></i>SemarangCar
            </a>
            <div class="d-flex align-items-center" id="authNavLinks"></div>
        </div>
    </nav>

    <main class="py-5">
        <div class="container" id="detailContainer">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const carId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', fetchCarDetail);

        async function fetchCarDetail() {
            if (!carId) {
                window.location.href = 'mobil.html';
                return;
            }
            try {
                const res = await fetch(`${API_BASE_URL}/mobil/${carId}`);
                if (!res.ok) throw new Error();
                const car = await res.json();

                document.getElementById('detailContainer').innerHTML = `
                    <div class="row g-5">
                        <div class="col-lg-6">
                            <img src="${car.gambarUrl || 'https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&q=80&w=800'}" class="img-fluid rounded-4 shadow-sm w-100">
                        </div>
                        <div class="col-lg-6">
                            <h2 class="fw-bold mb-2">${car.nama}</h2>
                            <p class="text-secondary mb-3">Merk: ${car.merk}</p>
                            <h3 class="text-primary fw-bold mb-4">${formatRupiah(car.harga)} <span class="fs-6 text-secondary fw-normal">/ hari</span></h3>
                            
                            <div class="row g-3 mb-4 text-center">
                                <div class="col-4">
                                    <div class="p-3 bg-white rounded-3 border">
                                        <i class="bi bi-gear text-primary fs-4"></i>
                                        <p class="small text-secondary mb-0 mt-1">Transmisi</p>
                                        <p class="fw-semibold mb-0">${car.transmisi}</p>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="p-3 bg-white rounded-3 border">
                                        <i class="bi bi-people text-primary fs-4"></i>
                                        <p class="small text-secondary mb-0 mt-1">Kapasitas</p>
                                        <p class="fw-semibold mb-0">${car.kapasitas} Orang</p>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="p-3 bg-white rounded-3 border">
                                        <i class="bi bi-fuel-pump text-primary fs-4"></i>
                                        <p class="small text-secondary mb-0 mt-1">Bahan Bakar</p>
                                        <p class="fw-semibold mb-0">${car.bahanBakar || 'Bensin'}</p>
                                    </div>
                                </div>
                            </div>

                            <h5 class="fw-bold mb-2">Deskripsi</h5>
                            <p class="text-secondary mb-4">${car.deskripsi || 'Mobil nyaman dan bersih untuk kebutuhan perjalanan Anda di Semarang.'}</p>

                            <a href="booking.html?id=${car.id}" class="btn btn-primary-custom w-100 py-3 fs-5">Sewa Sekarang</a>
                        </div>
                    </div>
                `;
            } catch (e) {
                document.getElementById('detailContainer').innerHTML = '<div class="alert alert-danger">Detail mobil tidak ditemukan.</div>';
            }
        }
    </script>
</body>
</html>
